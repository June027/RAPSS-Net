project:
  name: Proposed_3D_Base_CV
  seed: 42
  device: cuda
paths:
  data_dir: "data/processed"
  metadata_path: "data/processed/dataset_metadata.csv"
  log_dir: "outputs/cv/base"
data:
  cache_in_memory: true
  num_workers: 8
  clinical_keys: []
  strict_file_check: false
  strict_file_check_train: false
  strict_file_check_val: true
  augmentation:
    enabled: true
    flip_prob: 0.5
    affine_prob: 0.8
    affine_degrees: 30
    affine_translate: 0.2
    affine_scale:
    - 0.75
    - 1.25
    intensity_prob: 0.8
    intensity_gamma:
    - 0.7
    - 1.5
    intensity_contrast:
    - 0.7
    - 1.3
model:
  type: tridual_3d
  in_channels: 2
  base_dim: 32
  mamba_layers: 0
  use_peritumor: false
  use_deep_supervision: false
  use_dynamic_scan_router: false
  d_state: 16
  d_conv: 4
  expand: 2
  drop_path_rate: 0.0
  layer_scale_init_value: 0.0001
  use_kinetics_channel: false
train:
  internal_centers:
  - ISPY1
  - ISPY2
  external_centers:
  - Duke
  internal_test_size: 0.2
  use_domain_debias: false
  validation_mode: global_cv
  n_splits: 5
  epochs: 150
  batch_size: 8
  accumulation_steps: 2
  lr: 7.0e-05
  weight_decay: 0.01
  label_smoothing: 0.0
  clip_grad: 1.0
  amp: true
  compile: false
  patience: 30
  loss_warmup_epochs: 10
  ema_decay: 0.995
  aux_anneal_epochs: 100
  habitat_erosion_kernel: 3
  habitat_dilation_kernel: 5
  mask_drop_prob: 0.0
  use_class_weights: true
  use_weighted_sampler: false
  class_balance_power: 1.0
  sampler_num_samples_multiplier: 1.0
  resume_training: false
loss_weights:
  pcr: 1.0
  seg: 0.0
  domain: 0.0
  habitat: 0.0
test:
  bootstrap_iterations: 1000
  tta_enabled: false
  tta_flip_axes: []
